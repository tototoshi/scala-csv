name: CI
on:
  pull_request:
  push:
  schedule:
  - cron: '0 3 * * 2'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - java: 17
          - java: 25
    steps:
    - uses: actions/checkout@v7.0.1
    - run: gh extension install github/gh-actions-lock
    - run: gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: ${{matrix.java}}
        distribution: zulu
    - uses: coursier/cache-action@v9.0.1
    - uses: sbt/setup-sbt@v1.5.15
    - run: sbt
           -v
           --server
           "+ Test/compile"
           "+ test"
